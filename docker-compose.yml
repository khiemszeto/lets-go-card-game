services:
  db:
    image: mysql:9.4
    container_name: card-game-db
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: player_db
    ports:
      # bound to loopback so a passwordless root is not exposed to the network
      - "127.0.0.1:3306:3306"
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db-data:
