services:
  db:
    image: mysql:9.4
    container_name: card-game-db
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: player_db
    ports:
      # bound to loopback so a passwordless root is not exposed to the network
      - "127.0.0.1:3306:3306"
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    image: thirteencards:local
    container_name: card-game-app
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: demo
      JWT_SECRET: ${JWT_SECRET}
      APP_COOKIE_SECURE: "false"
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/player_db
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ""

volumes:
  db-data:
