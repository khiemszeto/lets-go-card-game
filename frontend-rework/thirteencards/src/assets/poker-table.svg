<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" fill="none" role="img" aria-label="Flat green poker table">
  <!-- Outer rail -->
  <rect x="24" y="24" width="752" height="432" rx="120" fill="#3d2b1f" />

  <!-- Rail padding -->
  <rect x="40" y="40" width="720" height="400" rx="108" fill="#5c4033" />

  <!-- Felt surface -->
  <rect x="56" y="56" width="688" height="368" rx="96" fill="#1f6b3a" />

  <!-- Subtle felt texture lines (flat style) -->
  <rect x="56" y="56" width="688" height="368" rx="96" fill="url(#feltHighlight)" opacity="0.35" />

  <!-- Inner playing line -->
  <rect x="120" y="120" width="560" height="240" rx="72" stroke="#2a8f4f" stroke-width="3" fill="none" opacity="0.6" />

  <!-- Dealer spot -->
  <circle cx="400" cy="240" r="28" fill="#185c31" opacity="0.5" />
  <circle cx="400" cy="240" r="18" stroke="#2a8f4f" stroke-width="2" fill="none" opacity="0.7" />

  <!-- Seat markers (4 players) -->
  <g fill="#185c31" opacity="0.55">
    <circle cx="400" cy="88" r="14" />
    <circle cx="712" cy="240" r="14" />
    <circle cx="400" cy="392" r="14" />
    <circle cx="88" cy="240" r="14" />
  </g>

  <defs>
    <linearGradient id="feltHighlight" x1="400" y1="56" x2="400" y2="424" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.08" />
    </linearGradient>
  </defs>
</svg>
